name: profile

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main, profile-v2]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: profile-output
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate cards
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          PROFILE_DENYLIST: ${{ secrets.PROFILE_DENYLIST }}
        run: |
          set -euo pipefail
          python -m scripts.generate --out dist

      - name: Push cards to output branch
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            BRANCH=output
          else
            BRANCH=output-test
          fi
          cd dist
          rm -f .shrine-output
          printf '%s\n' '# Generated cards' '' 'Generated by .github/workflows/profile.yml; do not edit.' > README.md
          git init -q
          git checkout -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore(output): regenerate live cards"
          git push -q --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:"$BRANCH" >/dev/null 2>&1

      - name: Keep workflow alive
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/profile.yml/enable
