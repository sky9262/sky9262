name: profile

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main, profile-v2]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions: {}

concurrency:
  group: profile-output
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate cards
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          PROFILE_DENYLIST: ${{ secrets.PROFILE_DENYLIST }}
        run: |
          set -euo pipefail
          python -m scripts.generate --out dist

      - name: Push cards to output branch
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            BRANCH=output
          else
            BRANCH=output-test
          fi
          cd dist
          test "$(find . -name '*.svg' | wc -l)" -eq 22
          rm -f .shrine-output
          printf '%s\n' '# Generated cards' '' 'Generated by .github/workflows/profile.yml; do not edit.' > README.md
          git init -q
          git checkout -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore(output): regenerate live cards"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)" push --force "https://github.com/$GITHUB_REPOSITORY" HEAD:"$BRANCH"

  keepalive:
    needs: generate
    # always(): a failing generate (e.g. an expired token) must not let GitHub
    # auto-disable the schedule after 60 days without repo activity
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Keep workflow alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/profile.yml/enable"
